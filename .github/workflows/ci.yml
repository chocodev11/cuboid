name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # RUSTFLAGS is deliberately not set: it would replace the crt-static flags of .cargo/config.toml.

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The fuzz crate is outside the workspace, so nothing above builds it. A check needs no
      # nightly toolchain and no sanitizer, only the C++ compiler of libfuzzer-sys.
      - name: Fuzz targets
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

      - name: Tests
        run: cargo nextest run --workspace --locked

      # Lavapipe (Mesa software Vulkan) is the software adapter of the Linux job. The headless
      # GPU tests fail under CI without an adapter and assert a software one; the final output
      # shows the adapter that rendered. Unverified until the first Linux run (ledger w0.4).
      - name: Shell GPU tests (lavapipe)
        if: runner.os == 'Linux'
        run: cargo nextest run -p cuboid-shell --locked --success-output final headless::

      - name: Doc tests
        run: cargo test --workspace --doc --locked

      - name: Layering
        run: cargo run --locked --package xtask -- layering

      - name: Parity ledger
        run: cargo run --locked --package xtask -- ledger

      # The logo files are rendered from the masters and committed; a master or a render that
      # changed without a new `cargo xtask brand` fails here.
      - name: Logo renders
        run: cargo run --locked --package xtask -- brand --check

      # The check above only hashes files. The committed renders come from Windows x64, so only
      # here is a render of the current code and dependencies expected to match them byte for byte.
      # Bash stops at the first failing command; the default PowerShell would go on to the diff.
      - name: Logo renders match the renderer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo run --locked --package xtask -- brand
          git diff --exit-code -- crates/cuboid-assets/brand

      - name: Licences, advisories, bans and sources
        run: cargo deny check
