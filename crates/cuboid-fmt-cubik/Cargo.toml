[package]
name = "cuboid-fmt-cubik"
description = "The .cubik container, records, schema, retention and extension entry, plus legacy .cub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Switch the deflate backend to zlib-rs; enable only if the W7.1 benchmarks justify it.
fast-deflate = ["flate2/zlib-rs"]

[dependencies]
cuboid-bson.workspace = true
cuboid-io.workspace = true
cuboid-model.workspace = true
cuboid-num.workspace = true
flate2.workspace = true
glam.workspace = true
log.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
# SHA-256 of the pixel levels in the canonical dump (native 10.2).
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
cuboid-testkit.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
