[package]
name = "cuboid-testkit"
description = "Dev-only test kit: golden harness, parity diff tiers, canonical dumps, scenario DSL, oracle gating"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# No workspace crate on purpose: the kit is a dev-dependency of crates of every layer, and a
# dependency back on them would compile the crate under test twice (see the crate docs).
[dependencies]
image.workspace = true
image-compare.workspace = true
ron.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
