[package]
name = "cuboid-cli"
description = "Binary cuboid-cli: dump and roundtrip without UI or GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cuboid-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Switch the deflate backend to zlib-rs; enable only if the W7.1 benchmarks justify it.
fast-deflate = ["cuboid-fmt-cubik/fast-deflate", "cuboid-fmt-minecraft/fast-deflate", "cuboid-fmt-voxel/fast-deflate"]

[dependencies]
cuboid-bson.workspace = true
cuboid-core.workspace = true
cuboid-fmt-cubik.workspace = true
cuboid-fmt-mesh.workspace = true
cuboid-fmt-minecraft.workspace = true
cuboid-fmt-voxel.workspace = true
cuboid-io.workspace = true
cuboid-model.workspace = true
cuboid-num.workspace = true

[dev-dependencies]
cuboid-testkit.workspace = true
glam.workspace = true
tempfile.workspace = true
