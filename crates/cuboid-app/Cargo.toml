[package]
name = "cuboid-app"
description = "Binary cuboid: wiring, jobs, I/O thread, backups, lifecycle, crash handling, platform, logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cuboid"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Switch the deflate backend to zlib-rs; enable only if the W7.1 benchmarks justify it.
fast-deflate = ["cuboid-fmt-cubik/fast-deflate"]

[dependencies]
cuboid-actions.workspace = true
cuboid-assets.workspace = true
cuboid-core.workspace = true
cuboid-fmt-bbmodel.workspace = true
cuboid-fmt-cubik.workspace = true
cuboid-fmt-mesh.workspace = true
cuboid-fmt-minecraft.workspace = true
cuboid-fmt-voxel.workspace = true
cuboid-io.workspace = true
cuboid-library.workspace = true
cuboid-mcp.workspace = true
cuboid-model.workspace = true
cuboid-num.workspace = true
cuboid-ops.workspace = true
cuboid-render.workspace = true
cuboid-scene.workspace = true
cuboid-settings.workspace = true
cuboid-shell.workspace = true
cuboid-ui.workspace = true
cuboid-ui-kit.workspace = true
cuboid-validate.workspace = true
directories.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
jiff.workspace = true
log.workspace = true
pollster.workspace = true
rayon.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry.workspace = true

[dev-dependencies]
cuboid-testkit.workspace = true
tempfile.workspace = true
