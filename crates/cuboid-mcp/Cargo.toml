cuboid-io.workspace = true
cuboid-library.workspace = true
cuboid-model.workspace = true
cuboid-ops.workspace = true
cuboid-validate.workspace = true
base64.workspace = true
glam.workspace = true
log.workspace = true
serde.workspace = true
# `preserve_order`: the keys of a result keep the order they were written in.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
cuboid-fmt-bbmodel.workspace = true
tempfile.workspace = true
