[package]
name = "cuboid-fmt-minecraft"
description = "Minecraft formats: Java JSON in and out, resource pack, display presets, .mcpe, .js, .java, .jpm, entity atlas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Switch the deflate backend to zlib-rs; enable only if the W7.1 benchmarks justify it.
fast-deflate = ["flate2/zlib-rs"]

[dependencies]
cuboid-assets.workspace = true
cuboid-io.workspace = true
cuboid-model.workspace = true
cuboid-num.workspace = true
cuboid-ops.workspace = true
cuboid-validate.workspace = true
flate2.workspace = true
glam.workspace = true
log.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
