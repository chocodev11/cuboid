# cargo-about configuration: third-party notices shipped with the installers (architecture 20.1).
# Generate with `cargo about generate <template>`; the template belongs to W7.3.

# Everything deny.toml allows plus the file-level copyleft of the `directories` helper.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Test and build-time code is not distributed.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Workspace crates are covered by LICENSE-MIT and LICENSE-APACHE.
private = { ignore = true }
