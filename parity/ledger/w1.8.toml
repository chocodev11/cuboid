tests = [
    "cuboid-io::registry::tests::codecs_attach_to_the_entry_that_can_do_the_job",
    "cuboid-io::registry::tests::a_codec_for_a_hidden_format_is_ignored",
    "cuboid-io::registry::tests::the_registry_is_shared_between_threads",
]

[[entry]]
id = "interop.4.4.dialog-lists"
