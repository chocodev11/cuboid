tests = [
    "cuboid-io::registry::tests::dialog_lists_follow_the_table_of_interop_4_4",
    "cuboid-io::registry::tests::a_dialog_needs_every_requested_capability",
    "cuboid-io::registry::tests::the_import_list_has_no_shortcut_entry_without_the_built_in_browser",
    "cuboid-io::registry::tests::dialog_lists_hide_mesh_formats_but_a_typed_path_still_resolves",
