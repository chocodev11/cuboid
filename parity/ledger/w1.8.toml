spec = "native 9.4"
tier = "P0"
status = "tested"
summary = "A syntax error carries the fixed message Invalid data found"
tests = ["cuboid-io::text::jsonlite::tests::the_error_message_is_fixed"]

[[entry]]
id = "interop.8.1.empty-text-is-a-syntax-error"
spec = "interop 8.1"
tier = "P4"
status = "tested"
summary = "FIX-ALWAYS: an empty or white-space-only text is a syntax error instead of a null dereference"
tests = ["cuboid-io::text::jsonlite::tests::rejected_input"]

[[entry]]
id = "native.9.4.lone-surrogate"
spec = "native 9.4"
tier = "P4"
status = "tested"
summary = "A \\uXXXX escape of a lone surrogate reads as U+FFFD"
tests = [
    "cuboid-io::text::jsonlite::tests::a_lone_surrogate_becomes_the_replacement_character",
    "cuboid-io::text::jsonlite::tests::only_unicode_escapes_are_decoded",
]
note = "Deviation: the original keeps the lone UTF-16 code unit in its string; a Rust string cannot hold one. A surrogate pair of two escapes is one character."

[[entry]]
id = "native.9.4.separator-strictness"
spec = "native 9.4"
tier = "P4"
status = "unverified-spec"
summary = "Comma handling beyond the leading and trailing comma rules, text after the root object and non-finite numbers"
tests = ["cuboid-io::text::jsonlite::tests::rejected_input"]
note = "The specification gives the trailing-comma and leading-comma rules only. The port rejects a missing comma between members or items and doubled commas, ignores everything after the root object, rejects -Infinity and NaN tokens, and reads 1e999 as infinity. The reference double parse may accept the culture's Infinity, -Infinity and NaN symbols, and older .NET parsers throw an overflow error for 1e999 (a syntax error here); open spec question. A nesting depth above 128 is a syntax error (port limit; the original has none)."

