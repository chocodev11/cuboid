[[entry]]
id = "native.9.4.typed-lookup-port-choices"
spec = "native 9.4"
tier = "P4"
status = "unverified-spec"
summary = "Vectors count array items, not numbers, and an integer read saturates"
tests = ["cuboid-io::text::jsonlite::tests::typed_lookups_read_the_documented_defaults"]
note = "The specification asks for arrays of at least 3 or 4 numbers. The port counts items, so [1,\"x\",null] reads as (1,0,0) (each item reads as a number with the type rule above) instead of using the default. An integer read of a value outside the i32 range saturates (3e10 reads as i32::MAX); the specification only says truncate toward zero."

[[entry]]
