# Parity ledger of W1.8, I/O core and text (cuboid-io). Format: parity/README.md.
#
# The pipeline texts keep `{App}` for the product name; the window code substitutes it
# (architecture 14.7). The codec session traits and the stub bodies of W0.2 are covered by
# `ledger/w0.2.toml`; this file covers the behaviour behind them.

wp = "W1.8"

# --- Registry (interop 4) -----------------------------------------------------------------

[[entry]]
id = "interop.4.1.registry-table"
spec = "interop 4.1"
tier = "P0"
status = "tested"
summary = "The registry holds the 23 entries of interop 4.1 in order with their keys, labels, filters, capabilities and message names"
tests = [
    "cuboid-io::registry::tests::registry_follows_the_table_of_interop_4_1",
    "cuboid-io::registry::tests::a_name_exists_exactly_for_what_the_entry_can_do",
]
note = "cubik carries the name Cubik for both directions it supports; cub, Sprite and lnk carry their upper-cased key (CUB, PNG, LNK)."

[[entry]]
id = "interop.4.2.visibility-rules"
spec = "interop 4.2"
tier = "P4"
status = "tested"
summary = "Rules M, SH, SX and V remove their entries, rule H keeps them registered, rule L registers the shortcut entry only with the built-in browser, and a removed entry is an unknown file type"
tests = [
    "cuboid-io::registry::tests::visibility_rules_remove_or_keep_entries",
    "cuboid-io::registry::tests::a_hidden_entry_is_an_unknown_file_type",
    "cuboid-io::registry::tests::the_shortcut_entry_needs_the_built_in_browser",
]

[[entry]]
id = "interop.4.3.lookup"
spec = "interop 4.3"
tier = "P4"
status = "tested"
summary = "Lookup takes the extension of the file name, tries the keys in registry order, prefers the first entry that can read (open) or write (save) and otherwise returns the last match, so png opens as Sprite and saves as Model Render"
tests = ["cuboid-io::registry::tests::lookup_follows_the_rules_of_interop_4_3"]
note = "'Has an importer' is decided from the capabilities (Load or Import, Save or Export), not from the codec objects attached later, so the lookup does not depend on composition. The extension follows the runtime's GetExtension: a trailing dot is no extension, a leading dot starts one, and the separators / \\ and : end the file name on every platform."

[[entry]]
id = "interop.4.3.case-sensitivity"
spec = "interop 4.3"
tier = "P4"
status = "tested"
summary = "Keys match case-sensitively in cubik29, so .VOX is an unknown file type, and case-insensitively in the modern import mode"
tests = ["cuboid-io::registry::tests::lookup_follows_the_rules_of_interop_4_3"]

[[entry]]
id = "arch.12.2.codec-attachment"
