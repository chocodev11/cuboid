[[entry]]
id = "interop.10.1.tolerance-subset"
spec = "interop 10.1"
tier = "P4"
status = "unverified-spec"
summary = "The exact extent of the serializer's tolerance"
tests = [
    "cuboid-io::text::tolerant::tests::numbers_literals_and_other_roots",
    "cuboid-io::text::tolerant::tests::the_last_of_repeated_names_wins",
]
note = "The specification names comments, single quotes, unquoted names and ignored unknown keys. The reader also accepts trailing commas, numbers like .5 and 5., any value as the root and text after the root, rejects a missing comma, keeps the last of repeated names, turns a lone surrogate into U+FFFD, and does not accept the serializer's NaN, Infinity, undefined, constructor and hexadecimal forms. A nesting depth above 128 is an error (port limit). Text after the root is ignored; the reference serializer may check for additional content and fail on it (open spec question). The schema (geometry, bone, cube, defaults, member-name case) belongs to the .mcpe importer."

