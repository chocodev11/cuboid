# --- Restriction bake and quarter turns (tools 3.5, 4.9) -------------------------------------------

[[entry]]
id = "tools.3.5.restriction-bake-x-y"
spec = "tools 3.5"
tier = "P1"
status = "tested"
summary = "The restriction bake of a rotation about X or Y (67.5, 90, 180, 292.5, 315) leaves the boxes and the face normals in place, at most one rotated axis in [0, 45] or [315, 360) on the 22.5 degree grid, and restores the pivot; the primary bakes the other selected elements first"
tests = [
    "cuboid-model::setters::tests::the_restriction_bake_keeps_the_geometry_and_leaves_one_small_axis",
    "cuboid-model::setters::tests::the_restriction_bake_rewrites_a_quarter_turn_as_faces_and_sizes",
    "cuboid-model::setters::tests::the_primary_bakes_the_other_selected_elements_first",
]
note = "Tools 17 item 4 as a whole (all axes with the expected numbers) is the acceptance of W2.3, which has no golden values yet; the tests check the geometric invariants."

[[entry]]
id = "tools.3.5.restriction-bake-z"
spec = "tools 3.5"
tier = "P1"
status = "unverified-spec"
summary = "The restriction bake of a Z rotation in (45, 315) applies the Z quarter turn of tools 4.9 as written, which is the engine rotation by -90 degrees, so the geometry changes unless the turn is 180 degrees"
tests = [
    "cuboid-model::setters::tests::the_z_quarter_turn_of_the_table_is_the_engine_rotation_by_minus_90",
    "cuboid-model::setters::tests::the_restriction_bake_keeps_the_geometry_and_leaves_one_small_axis",
]
note = "The X and Y turns of the table in tools 4.9 are the engine's +90 rotations, but the Z turn composed as X(+90), Y(+90), X(-90) gives (x, y, z) to (y, -x, z), the -90 rotation. Either the table is in MC handedness for Z only or the original bakes Z rotations wrongly; the port follows the table. Needs the oracle (tools 17 item 4)."

[[entry]]
id = "tools.4.9.quarter-turns"
spec = "tools 4.9"
tier = "P1"
status = "tested"
summary = "A quarter turn about X, Y or Z of the block centre (8, 8, -8) turns the box, the pivot and the size per the table, cycles the faces without moving their names (face copies store the folded UV corners), adds the UV rotation changes and swaps the folded corners of the arriving faces, discards the element's rotation and turns UV snap off; four turns are the identity"
tests = [
    "cuboid-model::setters::tests::quarter_turns_move_the_box_and_cycle_the_faces_about_the_block_centre",
    "cuboid-model::setters::tests::quarter_turns_change_the_uv_rotations_and_flip_the_arriving_faces",
    "cuboid-model::setters::tests::a_quarter_turn_moves_the_folded_corners_of_straddling_rectangles",
    "cuboid-model::setters::tests::four_quarter_turns_restore_the_element",
    "cuboid-model::setters::tests::a_quarter_turn_discards_the_rotation_of_the_element",
]
note = "Item 5 of tools 17 (the numbers for a non-cubic element) is the acceptance of W2.3; the tests derive the expected box and face cycle from the table's coordinate maps. The Z turn follows the table and is the engine rotation by -90 degrees, which contradicts the sentence that R is the +90 rotation; tools.3.5.restriction-bake-z holds the open question, and a direct Z turn (tools 10.11, rotate model) is affected as well. The turn count is normalised with rem_euclid, so an angle below -360 gives a positive count (tools 4.9 says mod with the sign rule of tools 3.4), and a zero count returns before the rotation reset and the UV snap change; the spec states neither. The bake only passes angles in 90..270. The propagation step of the bake skips selected objects that are not elements (the blueprint is restrictable), because the bake is an element operation."

[[entry]]
id = "tools.4.9.faces-only-variant"
spec = "tools 4.9"
tier = "P4"
status = "unverified-spec"
summary = "The faces-only quarter turn used by the UV projections cycles the faces and UV rotations without touching the geometry"
tests = ["cuboid-model::setters::tests::the_faces_only_quarter_turn_leaves_geometry_rotation_and_snap_alone"]
note = "ElementMut::quarter_turn_faces shares the face tables with the full turn. Tools 4.9 does not say whether the faces-only turn resets the element rotation or turns UV snap off; the port does neither."

