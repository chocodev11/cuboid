status = "tested"
summary = "A model box change gives the voxel world its new active box through set_active_box, which dirties the affected chunks; the active box is never assigned directly"
tests = ["cuboid-model::setters::tests::the_model_box_setter_clamps_in_order_and_notifies_the_voxel_world"]

# --- Invariant checker (arch 8.7, tools 16.2) -----------------------------------------------------

[[entry]]
id = "arch.8.7.object-invariants"
spec = "arch 8.7"
tier = "P4"
status = "tested"
summary = "check_invariants reports sizes below 0.001 (NaN included), rotations off the 5 and 22.5 degree grids (meshes only the 5 degree grid, 360 and the below -360 quirk allowed), UV rotations that are not quarter turns and raw UV corners outside [-1, 2], and passes a document edited through the setters; check_loaded_invariants accepts what a legal load or import produces (sizes below 0.001, unclamped UV corners) and keeps the other rules"
tests = [
    "cuboid-model::invariants::tests::a_fresh_document_satisfies_the_invariants",
    "cuboid-model::invariants::tests::a_document_edited_through_the_setters_satisfies_the_invariants",
    "cuboid-model::invariants::tests::a_size_below_the_minimum_is_reported_with_its_object",
    "cuboid-model::invariants::tests::rotations_must_sit_on_the_five_or_the_22_5_degree_grid",
    "cuboid-model::invariants::tests::uv_rotations_and_raw_corners_are_checked",
    "cuboid-model::invariants::tests::a_legal_load_or_import_passes_the_loaded_check_but_not_the_editor_check",
]
note = "check_invariants covers every object, so a document that used a transform dialog (tools 10.13, which bypasses the clamp) fails it; the harnesses must not mix those paths in. Loads and imports (native 6.3: cube sizes and mesh scales as stored; native 4.4.3 and 9.5: unclamped .cub and Minecraft JSON corners) are checked with check_loaded_invariants."

[[entry]]
id = "arch.8.7.display-ids"
spec = "arch 8.7"
tier = "P4"
status = "tested"
summary = "The checker reports a display id that is zero, repeated or above the issued count, and passes after pushes, removals, reorders and restores"
tests = ["cuboid-model::list::tests::display_ids_stay_valid_through_every_list_operation"]
note = "See tools.2.1.display-ids-after-reorder for why list order is not checked."

[[entry]]
id = "arch.8.7.voxel-invariants"
spec = "arch 8.7"
tier = "P4"
status = "tested"
summary = "check_invariants reports a palette that does not start with 0 or repeats a value, and an active box that is outside the grid or inverted; check_loaded_invariants accepts a forced duplicate (tools 7.4 import mode)"
tests = [
    "cuboid-model::invariants::tests::the_voxel_palette_and_the_active_box_are_checked",
    "cuboid-model::invariants::tests::a_forced_palette_duplicate_passes_only_the_loaded_check",
]
note = "A palette with a forced duplicate (tools 7.4 import mode) is reported by check_invariants, as the invariant is written, and accepted by check_loaded_invariants. The chunk counter check (non-zero count and occupancy bits against the cells) is built and passes on written worlds, but the public API cannot make a chunk disagree with itself, so its failing path is not exercised."

[[entry]]
id = "arch.8.7.selection-live-objects"
spec = "arch 8.7"
tier = "P4"
status = "tested"
summary = "The checker reports a selected or primary object that is not in the document; the highlight set is not checked"
tests = ["cuboid-model::invariants::tests::the_selection_may_only_name_live_objects"]

[[entry]]
id = "arch.8.7.structural-invariants"
spec = "arch 8.7"
tier = "P4"
status = "implemented"
summary = "Six faces per element and the active-face count equal to the face mask hold by construction of the model types"
note = "An element has a [Face; 6] array and the face mask is derived from the active flags, so the two InvariantError variants cannot be produced; they stay in the enum for the contract of architecture 8.7."
