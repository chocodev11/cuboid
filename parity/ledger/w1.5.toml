# Parity ledger of W1.5, model objects and setters (ids, ObjList, objects, setters, UV, journal,
# selection, invariants). Format: parity/README.md.
#
# Acceptance: tools 17 items 1, 2, 3, 6 and 7, the ObjList operations and the invariant checker.
# Items 4 and 5 (restriction bake, quarter turns) are the acceptance of W2.3, which uses the guard
# methods built here; the entries below cover what the guards do. Stubs of other packages that
# W1.5 had to fill (Document::new in contract.rs) are listed with the rules they carry.
#
# Integration note (texture record): the sketch of architecture 6 has `Mesh.texture:
# Option<Arc<Image>>` and a `TextureEntry { label, image, source }`. `Image` stays a pure raster,
# and the metadata of native 4.5.1 lives in the model as one record type `Texture { name, source,
# image }`, used by `TextureEntry.texture`, `Mesh.texture` and `Submesh.texture`, so that W1.7 can
# round-trip `n` for every texture. `TextureSource` keeps `fp`, `fn`, `fm`, `cs` and the file size.
#
# Integration note (stable_partition): the sketch of architecture 6 gives `stable_partition` a
# predicate over the item only. The port passes `(position, ObjId, &T)`, so move to top and move to
# bottom can decide by selection membership (identity) or by index without reaching into the Arcs.
#
# Integration note (invariants): `check_invariants` is for documents built through the setters and
# commands. `check_loaded_invariants` is for documents a legal load or import can produce; it skips
# the size minimum, the raw UV corner range and palette distinctness (native 6.3, native 4.4.3, 9.5,
# tools 7.4, arch 8.3) and keeps every other rule.
#
# Integration note (journal): `DocFlags::PROPS` is an addition to the flags of architecture 8.6, for
# writes of the model origin `g.o` and of the model box into the model properties.

wp = "W1.5"

# --- Identity and ObjList (tools 2.1, arch 8.2) ---------------------------------------------------

[[entry]]
id = "tools.2.1.display-ids"
spec = "tools 2.1"
tier = "P4"
status = "tested"
summary = "Display ids come from a per-kind counter starting at 1, removal keeps the ids of the rest, clear sets the counter back to 0 and a restore re-issues the ids from 1 in list order"
tests = [
    "cuboid-model::list::tests::display_ids_count_from_one_in_creation_order",
    "cuboid-model::list::tests::removal_keeps_display_ids_and_lookups_and_never_reuses_numbers",
    "cuboid-model::list::tests::clear_sets_the_display_counter_back_to_zero",
    "cuboid-model::list::tests::restore_keeps_the_object_ids_and_renumbers_from_one",
    "cuboid-model::list::tests::a_restore_from_fresh_items_numbers_them_in_list_order",
]

[[entry]]
id = "tools.2.1.display-ids-after-reorder"
spec = "tools 2.1"
tier = "P4"
status = "unverified-spec"
summary = "A reorder (move to top, move to bottom) keeps the display id of each object, so list order stops being id order"
tests = ["cuboid-model::list::tests::stable_partition_keeps_the_order_inside_both_groups"]
