# Parity ledger of W1.1, BSON (cuboid-bson). Format: parity/README.md.
#
# The crate reads and writes the BSON subset of native 3.1-3.6 and knows nothing about the
# records of native 4. Record-level rules that use it (null in a value-type key, quaternion
# members applied in document order, texture limits) belong to the ledger of W1.7.

wp = "W1.1"

# --- BSON subset and wire rules (native 3.1) ---------------------------------------------------

[[entry]]
id = "native.3.1.subset-types"
spec = "native 3.1"
tier = "P0"
status = "tested"
summary = "The reader returns the eight types of the subset (double, string, document, array, binary, boolean, null, int32) and int64 with their keys, values and exact byte spans"
tests = [
    "cuboid-bson::reader::tests::values_are_read_as_stored",
    "cuboid-bson::reader::tests::elements_carry_key_type_value_and_exact_spans",
    "cuboid-bson::reader::tests::spans_of_nested_elements_are_relative_to_the_payload",
    "cuboid-bson::subset_documents_agree_with_the_bson_crate_in_both_directions",
]

[[entry]]
id = "native.3.1.size-fields-checked"
spec = "native 3.1"
tier = "P4"
status = "tested"
summary = "Document, string and binary sizes are checked against their enclosing bounds and terminators; a malformed element ends the iteration with a typed error and a truncated payload is rejected"
tests = [
    "cuboid-bson::reader::tests::a_malformed_root_is_rejected",
    "cuboid-bson::reader::tests::a_malformed_element_ends_the_iteration_with_its_error",
    "cuboid-bson::reader::tests::a_valid_element_before_the_error_is_still_returned",
    "cuboid-bson::every_proper_prefix_of_a_document_is_rejected",
]

[[entry]]
id = "native.3.1.writer-exact-sizes"
spec = "native 3.1"
tier = "P0"
status = "tested"
summary = "The writer emits the type bytes of the subset, exact size fields patched in one pass, string lengths that count the terminator and array keys that are decimal indices; its output equals the bson crate's byte for byte"
tests = [
    "cuboid-bson::writer::tests::scalar_types_use_the_type_bytes_of_the_subset",
    "cuboid-bson::writer::tests::nested_sizes_are_patched_when_the_documents_close",
    "cuboid-bson::writer::tests::string_lengths_count_bytes_and_the_terminator",
    "cuboid-bson::writer::tests::array_elements_are_keyed_by_their_index",
    "cuboid-bson::writer::tests::index_keys_cover_the_largest_value",
    "cuboid-bson::subset_documents_agree_with_the_bson_crate_in_both_directions",
]

[[entry]]
id = "native.3.1.boolean-byte"
spec = "native 3.1"
tier = "P4"
status = "unverified-spec"
summary = "A boolean byte other than 0 and 1 is an error when the value is read"
tests = ["cuboid-bson::reader::tests::a_boolean_byte_other_than_zero_and_one_is_rejected_when_read"]
note = "The specification only lists the values 0x00 and 0x01 and does not say what Cubik's reader does with another byte. The port rejects it (BsonError::BadBool) instead of guessing a reading."

# --- Value mapping and order (native 3.2-3.4) --------------------------------------------------

[[entry]]
id = "native.3.2.f32-widening"
spec = "native 3.2"
tier = "P0"
status = "tested"
summary = "An f32 is written as its exact f64 widening and read back to the same f32 bits, subnormals, negative zero, infinities and quiet NaNs included"
