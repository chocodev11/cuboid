# --- Conversions of Cubik's reader (native 3.6) ------------------------------------------------

[[entry]]
id = "native.3.6.f32"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "An f32 target accepts double, int32 and int64; doubles round to the nearest f32"
tests = ["cuboid-bson::convert::tests::f32_takes_doubles_and_integers"]

[[entry]]
id = "native.3.6.f32-rounding"
spec = "native 3.6"
tier = "P0"
status = "unverified-spec"
summary = "A double that lies halfway between two f32 values rounds to the even one, and an int64 or int32 rounds once straight to f32"
tests = ["cuboid-bson::convert::tests::f32_takes_doubles_and_integers"]
note = "The specification says doubles are rounded to the nearest f32 and integers converted, without a tie rule or an intermediate type. The port uses the hardware rule (ties to even) and never goes through f64, so a large int64 is not rounded twice. What Cubik does for ties and for int64 is unknown."

[[entry]]
id = "native.3.6.i32"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "An i32 target accepts int32, int64 and double; doubles round half to even and every value out of range (NaN and infinities included) is an error"
tests = ["cuboid-bson::convert::tests::i32_takes_integers_and_rounds_doubles_half_to_even"]

[[entry]]
id = "native.3.6.byte"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "The byte field v is read as an int32 and must lie in 0..=255"
tests = ["cuboid-bson::convert::tests::the_byte_field_must_fit_a_byte"]

[[entry]]
id = "native.3.6.bool"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "A bool target accepts boolean, int32, int64 and double, where anything but zero is true"
tests = ["cuboid-bson::convert::tests::bool_takes_booleans_and_numbers_where_non_zero_is_true"]

[[entry]]
id = "native.3.6.enumeration"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "An enumeration accepts int32 and int64 as they are (undefined values kept) and a string that names a member in any letter case; other types and unknown names are errors"
tests = ["cuboid-bson::convert::tests::enumerations_take_integers_as_they_are_and_names_in_any_case"]

[[entry]]
id = "native.3.6.enum-edge-forms"
spec = "native 3.6"
tier = "P0"
status = "unverified-spec"
summary = "An int64 enumeration value outside the i32 range is an error, and only member names match a string"
tests = ["cuboid-bson::convert::tests::enumerations_take_integers_as_they_are_and_names_in_any_case"]
note = "The specification says integers are taken as they are and strings are matched to member names; it is silent about int64 values beyond int32 and about the forms .NET's enum parser would also take (a numeric string such as \"3\", a comma-separated list for flag enumerations). The port rejects all of them."

[[entry]]
id = "native.3.6.string"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "A string target accepts a string or null; other scalar types are rejected (the specification lets the port reject them)"
tests = ["cuboid-bson::convert::tests::strings_accept_null_and_nothing_else"]

[[entry]]
id = "native.3.6.invalid-utf8"
spec = "native 3.6"
tier = "P4"
status = "unverified-spec"
summary = "A string value that is not valid UTF-8 is an error when it is read"
tests = [
    "cuboid-bson::convert::tests::strings_accept_null_and_nothing_else",
    "cuboid-bson::reader::tests::a_string_that_is_not_utf8_is_rejected_when_read",
]
note = "The specification does not say how Cubik decodes invalid UTF-8 (a .NET decoder normally substitutes U+FFFD). The port rejects the string (BsonError::BadUtf8) so that no text is changed silently. Keys are byte strings and are never checked."

[[entry]]
id = "native.3.6.byte-array"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "A byte array accepts binary of any subtype, a base64 string or null; subtype 0x02 drops its inner length prefix"
tests = [
    "cuboid-bson::convert::tests::binary_values_of_any_subtype_are_taken_as_they_are",
    "cuboid-bson::convert::tests::subtype_two_carries_an_inner_length_that_must_match",
    "cuboid-bson::convert::tests::a_string_is_decoded_as_base64",
    "cuboid-bson::old_binary_values_read_like_the_bson_crate_reads_them",
]

[[entry]]
id = "native.3.6.base64-dialect"
spec = "native 3.6"
tier = "P4"
status = "unverified-spec"
summary = "A base64 string uses the standard alphabet; only space, tab, CR and LF are skipped, padding is required and non-zero trailing bits are accepted (AR== reads like AQ==); anything else is an error"
tests = ["cuboid-bson::convert::tests::a_string_is_decoded_as_base64"]
note = "The specification only says a string is decoded as base64. The dialect is modelled on .NET's Convert.FromBase64String, which is a guess about the decoder Cubik uses; URL-safe alphabets, missing padding and non-canonical trailing bits may behave differently in Cubik."

[[entry]]
id = "native.3.6.old-binary-length"
spec = "native 3.6"
tier = "P4"
status = "unverified-spec"
summary = "A binary value of subtype 0x02 whose inner length differs from the outer length minus 4 is an error"
tests = ["cuboid-bson::convert::tests::subtype_two_carries_an_inner_length_that_must_match"]
note = "The specification only says that subtype 0x02 carries an extra inner length prefix. Its consistency rule is the BSON specification's; what Cubik does with a mismatch is unknown."

[[entry]]
id = "native.3.6.object-list"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "An object target accepts a document and a list target an array, each or null; null is reported so that a value-type caller can fail the load"
tests = ["cuboid-bson::convert::tests::documents_and_arrays_accept_null_and_not_each_other"]

[[entry]]
id = "native.3.6.array-keys-ignored"
spec = "native 3.6"
tier = "P4"
status = "unverified-spec"
summary = "The keys of an array are ignored: its elements are read in document order whatever their keys"
tests = ["cuboid-bson::convert::tests::array_elements_are_read_in_order_whatever_their_keys"]
note = "Native 3.1 and 3.6 do not say whether Cubik checks array keys, or reorders by them, when it reads a list. The port reads the elements in order and never looks at the keys, which also fits arrays written by other BSON tools."

[[entry]]
id = "native.3.6.last-wins"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "When a key occurs twice the last occurrence wins"
tests = ["cuboid-bson::reader::tests::duplicate_keys_iterate_in_order_and_the_last_one_wins"]

[[entry]]
id = "native.3.6.unknown-types-skipped"
spec = "native 3.6"
tier = "P0"
status = "tested"
summary = "Unknown keys are ignored at every level, whatever their BSON type: elements of all 21 types of the BSON specification are skipped by their length"
tests = [
    "cuboid-bson::reader::tests::elements_of_types_cubik_never_writes_are_skipped_by_their_length",
    "cuboid-bson::documents_with_every_type_are_read_like_the_bson_crate_reads_them",
]

# --- Limits and robustness (native 8.1, 10.4) --------------------------------------------------

[[entry]]
id = "native.8.1.limits"
spec = "native 8.1"
tier = "P4"
status = "tested"
summary = "The size of the root document, the nesting depth and the number of elements of an array are limited before any decoder allocates for them"
tests = ["cuboid-bson::reader::tests::the_limits_are_checked_while_reading"]

[[entry]]
id = "native.8.1.limit-defaults"
spec = "native 8.1"
tier = "P4"
status = "unverified-spec"
summary = "Limits::DEFAULT allows 2^31-1 bytes, 64 levels and 2^24 elements per array"
tests = ["cuboid-bson::reader::tests::the_limits_are_checked_while_reading"]
note = "The specification asks for limits on document size and array lengths without numbers. The size is the largest value of the int32 size field and the depth is architecture 12.3; the array bound is the port's choice (a voxel world of resolution 254 has 48^3 chunks, a chunk at most 4096 voxels). The owner of the records (fmt-cubik) passes tighter limits where the format allows."

[[entry]]
id = "native.8.1.trailing-bytes"
spec = "native 8.1"
tier = "P4"
status = "unverified-spec"
summary = "Bytes after the root document are ignored; the document's slice tells where it ends"
tests = ["cuboid-bson::reader::tests::bytes_after_the_root_document_are_not_part_of_it"]
note = "The specification is silent about data after the root document. Native 3.1 says the reader relies on the size fields to find the end of each document, so the port infers that Cubik stops at the end of the root document too; a caller that wants to reject padding compares RawDoc::as_bytes with its payload."

[[entry]]
id = "native.10.4.no-panic"
spec = "native 10.4"
tier = "P4"
status = "tested"
summary = "Random bytes, random elements in a valid document and damaged valid documents (flipped bytes, wrong sizes, cuts, insertions, removals) under random limits produce errors, never a panic; a document that reads completely is written back byte for byte"
tests = [
    "cuboid-bson::arbitrary_bytes_never_panic",
    "cuboid-bson::arbitrary_elements_in_a_valid_document_never_panic",
    "cuboid-bson::damaged_documents_never_panic",
    "cuboid-bson::an_intact_document_walks_without_error",
]

[[entry]]
id = "native.10.4.fuzz"
spec = "native 10.4"
tier = "P4"
status = "implemented"
summary = "The bson fuzz target feeds arbitrary bytes, with and without a valid document header, under default and tight limits through the same walk, dump and rewrite check as the robustness tests"
note = "fuzz/fuzz_targets/bson.rs type-checks (cargo check --manifest-path fuzz/Cargo.toml --bin bson). No coverage-guided run has been made: cargo-fuzz is not installed on the Windows host. The architecture asks for one clean hour."

