[[entry]]
id = "arch.18.bson-decode-throughput"
spec = "arch 18"
tier = "P4"
status = "tested"
summary = "BSON decode of the voxel data of scene S2 (4 million records, 148 MiB) reaches at least 300 MiB/s"
tests = ["cuboid-bson::decoding_the_voxels_of_scene_s2_reaches_300_mib_per_second"]
note = "Timed #[ignore] test, run with --release. Measured on the Windows host in two runs: 851 and 864 MiB/s (892 and 906 MB/s), about 43 ns per voxel, best of 5, full record decode with typed getters (see benches/coding.rs for the criterion version)."
