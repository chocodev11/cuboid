[[entry]]
id = "arch.19.1.ssim-threshold"
spec = "arch 19.1"
tier = "P3"
status = "unverified-spec"
summary = "SSIM threshold 0.98 and the image-compare MSSIM metric are calibrated against real renders"
tests = [
    "cuboid-testkit::raster::tests::ssim_is_harsh_on_noise_in_flat_areas",
]
note = "Threshold is 'to be calibrated' (W7.4). image-compare's MSSIMSimple sums the window variances instead of averaging them, so it scores noise lower than textbook SSIM (one level of noise in a flat area scores about 0.79 and passes tier P2); the test pins that property. SSIM_MIN is only a default: callers of ssim and Golden::expect_ssim pass the min calibrated for their scene class, which the UI snapshot packages need before W7.4."

