[[entry]]
id = "arch.19.1.p0-transcendental"
spec = "arch 19.1"
tier = "P0"
status = "tested"
summary = "Positions after a pivot rotation and camera quaternion components are compared within 1e-5 relative, with an absolute floor of 1e-6 only for results that are zero"
tests = [
    "cuboid-testkit::diff::tests::transcendental_values_are_compared_relatively_with_a_tiny_floor",
    "cuboid-testkit::diff::tests::tolerance_handles_zeros_and_non_finite_values",
]
note = "The architecture words the exception as '1e-4 degrees or 1e-5 relative'. The kit applies each bound to its own quantity (Tolerance::ANGLE, Tolerance::RELATIVE) instead of accepting either bound for every quantity. The 1e-6 floor is the kit's choice (about 8 f32 ulps at 1.0), not a value of the specification."

