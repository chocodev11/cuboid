[[entry]]
id = "arch.19.1.oracle-gating"
spec = "arch 19.1"
tier = "P4"
status = "tested"
summary = "Tests that need an absent oracle or sample return early and print a SKIPPED (oracle absent) notice on stderr"
tests = [
    "cuboid-testkit::oracle::tests::locate_needs_a_set_variable_pointing_at_an_existing_path",
    "cuboid-testkit::oracle::tests::the_notice_names_the_class_the_variable_and_the_call_site",
    "cuboid-testkit::oracle::tests::an_absent_sample_yields_none_so_the_test_returns_early",
    "cuboid-testkit::oracle::tests::each_oracle_has_its_variable_and_class",
]
note = "libtest has no runtime skip: such a test counts as passed, and nextest hides the notice of a passing test unless it runs with --success-output immediate. A test that must show up as skipped adds an ignore attribute with the oracle as its reason and maintainers run it with --include-ignored (oracle module docs). Architecture 19.1 lists CUBOID_PRIVATE_UI_DUMP, CUBOID_PRIVATE_SPRITES and CUBOID_PARITY_REFS together without classes; the kit classes the first two O2 and CUBOID_PARITY_REFS O1 (captures of the original program). Integration to confirm."

