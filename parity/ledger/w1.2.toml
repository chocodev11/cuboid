[[entry]]
id = "arch.6.image-name-lives-in-the-model"
spec = "arch 6"
tier = "P4"
status = "tested"
summary = "Image is a pure raster type and has no name; the texture record metadata of native 4.5.1 (n, fp, cs and the other record fields) is held by the model, and W1.5 adds a texture record used by the list, mesh and submesh textures"
