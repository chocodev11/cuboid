# Parity ledger of W1.2, images (cuboid-image). Format: parity/README.md.
#
# Stored texture formats, BC1/BC3, texture files, the content signature, the raster primitives of
# the paint tools, the deterministic packer with the gutter fill, and the alpha statistics. Pixel
# parity with the original is checked on its own output (oracle O1); until a maintainer has
# captures, the entries stay at `tested` and the open points are `unverified-spec` entries.

wp = "W1.2"

# --- Stored texture formats (native 4.5.1) ------------------------------------------------------

[[entry]]
id = "native.4.5.1.format-byte-orders"
spec = "native 4.5.1"
tier = "P0"
status = "tested"
summary = "Every stored format code decodes with the byte order of the table (A8, RGB24, RGBA32, ARGB32, BGRA32, RGB565, the two 4444 words, DXT1, DXT5), with rows and bytes bottom to top"
tests = [
    "cuboid-image::format::tests::every_format_reads_its_byte_order",
    "cuboid-image::format::tests::rgb565_keeps_green_at_six_bits",
    "cuboid-image::format::tests::rows_stay_bottom_to_top",
    "cuboid-image::format::tests::narrow_channels_widen_to_full_scale_and_quantise_to_the_nearest_level",
]

[[entry]]
id = "native.4.5.1.format-reencode"
spec = "native 4.5.1"
tier = "P0"
status = "tested"
summary = "Every format code encodes RGBA8 to level_len bytes, and what decodes from them encodes to the same bytes; the 16-bit formats and the 32-bit formats are lossless for every word and texel"
tests = [
    "cuboid-image::format::tests::every_format_decodes_and_reencodes",
    "cuboid-image::format::tests::every_16_bit_word_survives_a_decode_and_encode",
    "cuboid-image::format::tests::lossless_formats_survive_an_encode_and_decode",
    "cuboid-image::format::tests::level_sizes_follow_the_format_table",
]

[[entry]]
id = "native.4.5.1.mip-chain"
spec = "native 4.5.1"
tier = "P0"
status = "tested"
summary = "Bytes behind level 0 (a mip chain, 1023 bytes for a 16 x 16 RGB24 default texture) are ignored by the decoder and not written by the encoder"
tests = ["cuboid-image::format::tests::a_mip_chain_behind_level_0_is_tolerated_and_dropped_by_the_encoder"]

[[entry]]
id = "native.4.5.1.unknown-codes-and-short-data"
spec = "native 4.5.1"
tier = "P4"
status = "tested"
