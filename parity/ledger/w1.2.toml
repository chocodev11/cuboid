# --- Content signature (native 4.5) -------------------------------------------------------------

[[entry]]
id = "native.4.5.signature-vectors"
spec = "native 4.5"
tier = "P0"
status = "tested"
summary = "The signature is the MD5 digest decoded as text with the ANSI code page, one character per digest byte; vectors for Windows-1252 and Windows-1258 (whose combining marks differ from 1252), and Windows-1252 for an unknown page"
tests = [
    "cuboid-image::signature::tests::vectors_of_windows_1252",
    "cuboid-image::signature::tests::vectors_of_windows_1258_with_its_combining_marks",
    "cuboid-image::signature::tests::an_unknown_code_page_reads_as_windows_1252",
    "cuboid-image::signature::tests::the_signature_follows_the_file_content",
]

[[entry]]
id = "native.4.5.signature-undefined-bytes"
spec = "native 4.5"
tier = "P0"
status = "unverified-spec"
summary = "Digest bytes that a code page leaves undefined read as the C1 control characters of the same number"
tests = ["cuboid-image::signature::tests::bytes_a_code_page_leaves_undefined_read_as_c1_controls"]
note = "Matches Windows for 1252; the original runs on Mono, whose tables for undefined bytes may differ (native 12 item 9). A mismatch only causes one reload of the texture."

# --- Texture files (tools 5.10, 5.11) -----------------------------------------------------------

[[entry]]
id = "tools.5.10.dds-header"
spec = "tools 5.10"
tier = "P0"
status = "tested"
summary = "A DDS file needs the magic DDS and header size 124, takes width and height from the low halves of the size words, reads the last FourCC character 5 as DXT5 and anything else as DXT1, and uses every byte from offset 128 as level 0"
tests = [
    "cuboid-image::file::tests::dds_headers_are_checked_as_far_as_the_original_does",
    "cuboid-image::file::tests::only_the_last_fourcc_character_5_selects_dxt5",
    "cuboid-image::file::tests::an_empty_or_oversized_dds_is_refused",
]
note = "Missing block data is an error (the engine's 'not enough data'); surplus bytes are ignored. Both are UNVERIFIED in the specification."

[[entry]]
id = "tools.5.10.dds-result-format"
spec = "tools 5.10"
tier = "P4"
status = "unverified-spec"
summary = "A DDS texture decodes to an in-memory RGBA image that a writer stores as RGBA32"
tests = ["cuboid-image::file::tests::dds_blocks_are_read_without_flipping"]
note = "Tools 5.10 says the result is converted to uncompressed ARGB; native 4.5.1 lists formats 10 and 12 as expected in files from DDS sources. Both read back in Cubik. Keeping the blocks as a retained DXT record is possible with Image::from_stored."

[[entry]]
id = "tools.5.10.tga-loader"
spec = "tools 5.10"
tier = "P0"
status = "tested"
summary = "TGA types 2 and 10 at 24 and 32 bits read B G R (A) in file order from the bottom-left, ignore the origin bit, skip the ID field, run RLE packets across rows, and fail on truncated or overrunning data; a depth the original does not know reads as transparent pixels without consuming input"
tests = [
    "cuboid-image::file::tests::tga_raw_true_colour_reads_bgr_and_bgra_in_file_order",
    "cuboid-image::file::tests::tga_ignores_the_origin_bit_and_skips_the_id_field",
    "cuboid-image::file::tests::tga_rle_packets_run_across_rows",
    "cuboid-image::file::tests::corrupt_tga_data_is_an_error",
    "cuboid-image::file::tests::tga_depths_other_than_24_and_32_read_transparent_pixels_without_consuming_input",
]
note = "That an RLE packet running past the end of the image counts as corrupt data is a port choice: the specification only says that corrupt RLE data raises an error."

[[entry]]
id = "tools.5.10.tga-blank-image"
spec = "tools 5.10"
tier = "P0"
status = "unverified-spec"
summary = "A TGA with a colour map or an image type other than 2 and 10 gives a blank image of the header size, transparent black"
tests = ["cuboid-image::file::tests::tga_colour_maps_and_other_types_give_a_blank_image_of_the_header_size"]
note = "The content of the engine's blank image is UNVERIFIED in the specification."

[[entry]]
id = "tools.5.10.general-decoder"
spec = "tools 5.10"
tier = "P2"
status = "tested"
summary = "Any other extension is decoded by content (PNG, JPEG) to RGBA8 with rows bottom to top; RGB images get opaque alpha and 16-bit samples are reduced"
tests = [
    "cuboid-image::file::tests::png_round_trip_keeps_pixels_and_orientation",
    "cuboid-image::file::tests::rgb_png_gets_opaque_alpha_and_16_bit_png_is_reduced",
    "cuboid-image::file::tests::jpeg_decodes_to_bottom_up_rows_within_the_codec_error",
]
note = "The workspace enables the image crate for png, jpeg and tga only. The specification only says that other extensions go to the general decoder and that an undecodable file becomes a 1 x 1 image, so a BMP or GIF file is an error here, which the command turns into that image. JPEG pixels can differ slightly from the engine's decoder (tier P2)."

[[entry]]
id = "tools.5.10.undecodable-general-file"
spec = "tools 5.10"
tier = "P4"
status = "tested"
summary = "An undecodable general file is an error of decode_file; the texture commands turn it into the 1 x 1 image of the original (T6)"
tests = ["cuboid-image::file::tests::garbage_and_empty_files_are_errors_not_panics"]

[[entry]]
id = "tools.5.11.png-writer"
spec = "tools 5.11"
tier = "P2"
status = "tested"
summary = "A texture is written as an 8-bit RGBA PNG with the top row first, and reads back to the same pixels"
tests = [
    "cuboid-image::file::tests::png_round_trip_keeps_pixels_and_orientation",
    "cuboid-image::file::tests::png_files_store_the_top_row_first",
    "cuboid-image::file::tests::an_empty_image_has_no_png",
]

# --- Raster primitives (tools 13.2) -------------------------------------------------------------

[[entry]]
id = "tools.13.2.pen"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "The pen sets one texel without a clip rectangle; texels outside the texture are ignored"
tests = ["cuboid-image::contract::tests::texels_outside_the_buffer_are_ignored"]
note = "The memory of the last painted texel is stroke state of the paint tool (W2.8), not of the raster."

[[entry]]
id = "tools.13.2.line"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "The line is the integer Bresenham line of the err = dx + dy form from start to current (diagonal step at ties, so the direction matters), single texels up to thickness 1, a disc per point above, clipped to the start rectangle"
tests = [
    "cuboid-image::raster::tests::bresenham_takes_the_diagonal_step_at_ties_and_depends_on_the_direction",
    "cuboid-image::raster::tests::every_line_is_a_connected_path_with_one_texel_per_major_step",
    "cuboid-image::raster::tests::thick_lines_stamp_a_disc_at_every_point_and_are_clipped_to_the_start_rectangle",
]

[[entry]]
id = "tools.13.2.rectangle"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "The rectangle fills the inclusive box between the corners in any order and is not clipped to the atlas entry"
tests = ["cuboid-image::raster::tests::rectangle_covers_both_corners_in_any_order_and_stays_in_the_buffer"]

[[entry]]
id = "tools.13.2.brush"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "The round brush and the sprayer stamp the disc of the loop bounds trunc(c - r) to max(1, c + r) without the texels at dx^2 + dy^2 >= r^2 - 1 when that exceeds 1, clipped to the clip rectangle: diameter 7 is a disc of seven texels, diameters 1 and 2 are 2 x 2 blocks"
tests = [
    "cuboid-image::raster::tests::round_brush_of_diameter_7_is_a_disc_of_seven_texels_across",
    "cuboid-image::raster::tests::small_round_brushes_follow_the_loop_bounds_of_the_formula",
    "cuboid-image::raster::tests::the_brush_is_clipped_to_the_rectangle_and_the_buffer",
]

[[entry]]
id = "tools.13.2.square"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "The square brush covers round(c + 0.5 - r) to below round(c + 0.5 + r) per axis with half-to-even rounding and ignores the clip rectangle"
tests = ["cuboid-image::raster::tests::square_brush_spans_round_half_even_and_ignores_the_clip"]

[[entry]]
id = "tools.13.2.fill"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "The flood fill joins texels similar to the clicked colour (alpha equal, each channel within the tolerance) that are not already similar to the fill colour (within half the tolerance), inside the clip rectangle, and a fill with the colour already there changes nothing"
tests = [
    "cuboid-image::raster::tests::fill_stops_at_walls_and_leaks_through_gaps_but_not_diagonally",
    "cuboid-image::raster::tests::fill_is_limited_by_the_clip_rectangle_and_ignores_seeds_outside_it",
    "cuboid-image::raster::tests::fill_tolerance_joins_close_colours_and_keeps_alpha_exact",
    "cuboid-image::raster::tests::a_fill_that_changes_nothing_ends",
]

[[entry]]
id = "tools.13.2.fill-connectivity"
spec = "tools 13.2"
tier = "P1"
status = "unverified-spec"
summary = "The scanline fill is four-way connected"
tests = ["cuboid-image::raster::tests::fill_stops_at_walls_and_leaks_through_gaps_but_not_diagonally"]
note = "The specification says scanline flood fill without naming the connectivity; four-way is the classic scanline form. The boundary of 'within' (<= against <) is also open; T = 0 needs <=."

[[entry]]
id = "tools.13.2.noise-fill"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "With a tolerance above 0 each painted texel gets the fill colour plus an independent uniform offset of +-T/2 levels per RGB channel (alpha kept, clamped) from the injected generator"
tests = [
    "cuboid-image::raster::tests::noise_fill_jitters_each_channel_within_half_the_amount_in_scan_order",
    "cuboid-image::raster::tests::jitter_clamps_to_the_byte_range",
]

[[entry]]
id = "tools.13.2.noise-rounding-and-order"
spec = "tools 13.2"
tier = "P1"
status = "unverified-spec"
summary = "The jittered level is truncated to a byte, and texels are painted from the bottom row up, left to right, drawing red, green, blue per texel"
tests = ["cuboid-image::raster::tests::noise_fill_jitters_each_channel_within_half_the_amount_in_scan_order"]
note = "Neither the rounding of the offset nor the visiting order of the original is specified; with a seeded generator the texture differs from the original's, with the same distribution."

[[entry]]
id = "tools.13.2.magic"
spec = "tools 13.2"
tier = "P1"
status = "tested"
summary = "Magic replaces every texel inside the clip rectangle that equals the clicked colour with the paint colour"
tests = ["cuboid-image::raster::tests::magic_replaces_the_clicked_colour_inside_the_clip_only"]

# --- Packing (tools 5.2, 5.4, interop 12.2, 16.7.7) ---------------------------------------------

[[entry]]
id = "tools.5.2.deterministic-packer"
spec = "tools 5.2"
tier = "P4"
status = "tested"
summary = "The packer depends only on the sizes and their order, padding and maximum side: rectangles stay inside the atlas apart by the padding, come back in input order, the atlas is the smallest power of two that fits, empty rectangles take no space, and rectangles that do not fit are an error"
tests = [
    "cuboid-image::pack::tests::rectangles_land_inside_the_atlas_apart_by_the_padding",
    "cuboid-image::pack::tests::the_layout_depends_only_on_the_input",
    "cuboid-image::pack::tests::the_atlas_is_the_smallest_power_of_two_that_fits",
    "cuboid-image::pack::tests::rectangles_that_do_not_fit_are_an_error",
    "cuboid-image::pack::tests::empty_rectangles_take_no_space",
    "cuboid-image::pack::tests::composing_puts_each_image_in_its_rectangle",
    "cuboid-image::contract::tests::blit_copies_rows_and_cuts_off_what_does_not_fit",
]
note = "The engine's packer layout cannot be reproduced (tools 5.4, interop 12.2); parity is sampled pixels."

[[entry]]
id = "tools.5.4.gutter-fill"
spec = "tools 5.4"
tier = "P0"
status = "tested"
summary = "The gutter fill gives each fully transparent texel outside all packed rectangles the colour of its first non-transparent neighbour (left, right, below, above in the flat bottom-up array), reading the unmodified atlas, with left and right wrapping across row ends and texel 0 never a source"
tests = [
    "cuboid-image::pack::tests::bleed_fills_a_one_texel_ring_and_wraps_across_row_ends",
    "cuboid-image::pack::tests::texel_0_is_never_a_source",
    "cuboid-image::pack::tests::bleed_leaves_texels_inside_rectangles_and_opaque_texels_alone",
]

[[entry]]
id = "interop.16.7.7.gutter-fill"
spec = "interop 16.7.7"
tier = "P0"
status = "tested"
summary = "The voxel atlas gutter fill is the same pass: neighbours i - 1 (above 0), i + 1, i - width (above 0), i + width, first with alpha above 0"
tests = [
    "cuboid-image::pack::tests::bleed_fills_a_one_texel_ring_and_wraps_across_row_ends",
    "cuboid-image::pack::tests::texel_0_is_never_a_source",
]

