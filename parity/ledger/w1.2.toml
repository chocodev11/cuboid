    "cuboid-image::file::tests::an_empty_or_oversized_dds_is_refused",
    "cuboid-image::file::tests::a_small_png_declaring_a_huge_size_is_refused_before_decoding",
]
note = "MAX_TEXELS (2^26) is below what the original can hold (an 8192 x 16384 texture survives its width-only downscale), so a .cubik from Cubik with such a texture is refused: a deviation for the architecture to accept or to lift by raising the limit."

