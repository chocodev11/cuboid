[[entry]]
id = "native.4.5.1.block-encoder"
spec = "native 4.5.1"
tier = "P2"
status = "tested"
summary = "The block compressor reproduces solid blocks and blocks of two exact 565 colours, keeps punch-through alpha and BC3 alpha endpoints, and keeps gradients within the quantisation error"
tests = [
