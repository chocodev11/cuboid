    "cuboid-image::bc::tests::partial_blocks_encode_to_whole_blocks",
]
note = "Port-defined: the original never writes DXT from RGBA, and the port writes RGBA32 for created images, so the compressor only serves callers that ask for a DXT record."

[[entry]]
