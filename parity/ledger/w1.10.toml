# --- Missing keys and null values (S11) --------------------------------------------------------

[[entry]]
id = "menus.9.1.settings-missing-key-defaults"
spec = "menus 9.1"
tier = "P4"
status = "tested"
summary = "A key an existing file lacks takes the original's field value, which differs from the first-run value for renderHiddenElements (on), objCenterOnImport (off), advAtlasSquare (off) and the five key strings (None, written back as null); keys the file has are read as written"
tests = [
    "cuboid-settings::schema::tests::keys_a_file_lacks_take_the_field_defaults",
    "cuboid-settings::schema::tests::keys_a_file_has_win_over_the_field_defaults",
]
note = "menus 9.1 calls the missing key strings '(empty)'. The port stores None for them (review claim 13 says null), which the file shows as null instead of an empty string. The behaviour is the same: an empty or null binding means the built-in keys (menus 6.6). Only the bytes written back differ."

[[entry]]
id = "app.10.1.settings-missing-key-other-keys"
spec = "app 10.1"
tier = "P4"
status = "unverified-spec"
summary = "A key an existing file lacks takes the same value as in a fresh file, except for the four differences of menus 9.1"
tests = [
    "cuboid-settings::schema::tests::keys_a_file_lacks_take_the_field_defaults",
]
note = "app 10.1 and 10.2 say a missing key takes its table default; menus 9.1 lists four exceptions; review round 1 claim 13 also lists appSkin, minecraftSkin and the path strings as null for a missing key. The port follows menus 9.1 (acceptance of W1.10): the exceptions are the four of menus 9.1, every other key takes the first-run value. A null path or theme differs from the first-run value only in what Preferences shows; the theme reads as Light either way (D10)."

[[entry]]
id = "app.0.2.settings-d10-unusable-flag-or-integer"
spec = "app 0.2"
