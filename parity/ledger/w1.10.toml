    "cuboid-settings::store::tests::a_missing_file_is_a_fresh_start",
    "cuboid-settings::store::tests::an_empty_or_null_file_is_a_fresh_start_and_stays_in_place",
    "cuboid-settings::schema::tests::text_is_empty_null_an_object_or_rejected",
