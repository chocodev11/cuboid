# --- File browser locations (menus 10.10) ------------------------------------------------------

[[entry]]
id = "menus.10.10.settings-recent-locations"
spec = "menus 10.10"
tier = "P4"
status = "tested"
summary = "Recent locations: at most 5, a listed path changes nothing (its time is not refreshed), and a full list drops the oldest entry first"
tests = [
    "cuboid-settings::locations::tests::recent_holds_five_and_drops_the_oldest",
    "cuboid-settings::locations::tests::a_listed_recent_path_is_not_refreshed",
]

[[entry]]
id = "menus.10.10.settings-legacy-locations-text"
spec = "menus 10.10"
tier = "P4"
status = "tested"
summary = "The original's SavedLocations text is read into the recent and favourite lists: line feeds removed, entries between 'SavedLocationEntry {' and '}', exactly five non-empty comma-separated fields, others skipped with the log line 'Not enough arguments'"
tests = [
    "cuboid-settings::locations::tests::the_original_text_is_read_into_both_lists",
    "cuboid-settings::locations::tests::entries_without_five_non_empty_fields_are_skipped",
]

[[entry]]
id = "menus.10.10.settings-legacy-location-fields"
spec = "menus 10.10"
tier = "P4"
status = "unverified-spec"
summary = "How the five fields of a saved location are read"
tests = [
    "cuboid-settings::locations::tests::the_original_text_is_read_into_both_lists",
    "cuboid-settings::locations::tests::an_unknown_value_is_skipped_and_is_not_reported_as_missing_arguments",
]
note = "menus 10.10 gives the field order and the date format but not what happens to an entry whose field is not one of the listed values. The port skips an entry whose list name is not Recent or Favorite, whose flag is not True or False, whose type is not Root, File, Folder or LogicalDrive, or whose date does not read as MM/dd/yyyy HH:mm:ss. The date has no offset; it is stored as seconds since 1970 as if it were UTC, which keeps the order of the stamps. Each of these skips logs 'settings: saved location skipped: ' and the reason, never 'Not enough arguments', which is only for a wrong field count."

[[entry]]
id = "menus.10.10.settings-saved-locations-per-entry"
spec = "menus 10.10"
tier = "P4"
status = "tested"
summary = "Port: the stored locations of the cuboid section are read entry by entry (D10): a location that cannot be read is dropped and the other entries, the other list and the defaults-added marker are kept"
tests = [
    "cuboid-settings::locations::tests::one_unreadable_location_costs_only_itself",
    "cuboid-settings::cuboid::tests::every_key_round_trips",
]
note = "Port-only storage; the original keeps the list as one text. Recent paths are compared with ASCII case ignored on Windows and as written elsewhere."

