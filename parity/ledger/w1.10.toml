status = "tested"
summary = "D10: null or a wrong type in one of the 37 boolean and integer keys gives that key its first-run value and keeps every other key"
tests = [
    "cuboid-settings::schema::tests::there_are_37_flag_and_integer_keys",
    "cuboid-settings::schema::tests::null_in_a_flag_or_integer_key_costs_only_that_key",
    "cuboid-settings::schema::tests::a_wrong_type_takes_the_first_run_value_of_its_key",
    "cuboid-settings::store::tests::a_file_with_one_unusable_key_keeps_the_others",
]

[[entry]]
id = "app.10.1.settings-numbers-as-text"
spec = "app 10.1"
tier = "P4"
status = "tested"
summary = "Numbers written as strings are accepted in integer keys; text that is not a whole number falls back to the key's default"
tests = [
    "cuboid-settings::schema::tests::numbers_written_as_text_are_accepted",
    "cuboid-settings::schema::tests::integers_that_are_words_fractions_or_too_large_fall_back",
]

[[entry]]
id = "app.10.1.settings-conversion-edge-cases"
spec = "app 10.1"
tier = "P4"
status = "unverified-spec"
summary = "Conversions the specification does not spell out: the texts true and false in boolean keys, fractions and values beyond i32 in integer keys, a non-string in a string key, recent files without a path"
tests = [
    "cuboid-settings::schema::tests::numbers_written_as_text_are_accepted",
    "cuboid-settings::schema::tests::integers_that_are_words_fractions_or_too_large_fall_back",
    "cuboid-settings::schema::tests::a_wrong_type_takes_the_first_run_value_of_its_key",
    "cuboid-settings::recent::tests::stored_entries_are_read_in_order_and_unusable_ones_are_dropped",
]
note = "app 10.1 says only 'a value that cannot be converted to its key's type' and that numbers written as strings are accepted. The port accepts the texts true and false (any case) for booleans, and treats a fraction, a number outside the i32 range, a boolean written as a number and a number in a string key as unusable (D10 fallback, logged without the value). A recent file without a path is dropped; one without a name gets the file name of its path."

