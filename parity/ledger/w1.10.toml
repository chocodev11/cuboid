# Parity ledger of W1.10, settings. Format: parity/README.md.

wp = "W1.10"

# --- Settings file (app 10.1, 10.2) ------------------------------------------------------------

[[entry]]
id = "app.10.1.settings-write-order"
spec = "app 10.1"
tier = "P0"
status = "tested"
summary = "The file holds the 54 keys of the original under their names in the original's write order, strings never set as null and recentFiles as {max, list}; the port's section and unknown keys follow"
tests = [
    "cuboid-settings::schema::tests::the_first_run_file_has_the_keys_values_and_order_of_the_original",
    "cuboid-settings::store::tests::the_file_is_pretty_json_with_the_version_first_and_a_final_newline",
]
note = "The port writes pretty JSON with a leading version key (architecture 15); the original writes compact JSON. Key names, order, value formats and null strings are the original's."

