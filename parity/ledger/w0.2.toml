# Parity ledger of W0.2, contracts (cross-crate public stubs). Format: parity/README.md.
#
# The entries record the contract decisions of the stubs and the value-level facts they carry
# (flag values, discriminants, fresh values, defaults). Behaviour behind the stub bodies belongs to
# the ledgers of the packages that implement them. Compile-time facts (object safety of the traits,
# `Send` bounds) are checked by helper functions of the test modules and by the build itself.

wp = "W0.2"

