[[entry]]
id = "arch.6.scene-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-scene exposes the views, cameras, navigation, preview anchors, Raycaster, SceneIndex, gizmo state, render extracts and draw lists"
note = "Stub bodies belong to W3.1, W3.2 and W3.4. FrameKey lives here and not in cuboid-render because a draw list carries it. Rect is a twin of the UI kit's rectangle."

[[entry]]
id = "arch.6.io-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-io exposes the registry, the importer and exporter traits with their sessions, prompts, answers, artifacts, profiles and write_atomic"
note = "Stub bodies belong to W1.8 and fail with errors or log. A render requested by an exporter is answered with the PNG bytes (Answer::Rendered), so the crate needs no image type."

[[entry]]
id = "arch.6.core-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-core exposes Core, History, Compat, Clock, InputFrame, CustomTool, Command and CmdOutcome with the supporting state types"
note = "Stub bodies belong to W2.1 and W2.9. History::push takes the categories as a parameter because the undo step needs them to capture the current state. UndoCallback is data (Effects), not a closure. The core does not own the scene index: tool strokes ask for collider freezes and refreshes through Effects::colliders, and the core holds the edit environment, the held-key map, the tool colours and sizes and the active tool."

[[entry]]
id = "arch.10.1.command-starter-set"
spec = "arch 10.1"
tier = "P4"
status = "implemented"
summary = "Command is an enum of undoable commands grouped by domain with the payload of their dialogs"
note = "A starting set that fixes the shape; W2.1 completes it with the rest of the label catalogue of tools 15.6 and fills COMMAND_TABLE."

[[entry]]
id = "arch.6.render-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-render exposes Renderer with new, sync, render_views, start_png_render and poll_readbacks, plus AdapterCaps, UploadBudget, ViewTexture and ReadbackId"
note = "Stub bodies belong to W3.3 and W3.7. start_png_render takes a PngJob (draw list plus extract) because the renderer cannot see the model crate; the exporter-level RenderRequest is in cuboid-model."

[[entry]]
id = "arch.6.ui-kit-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-ui-kit exposes the layout functions, the pointer router, the focus model, skins, text metrics, the text field and the Kit context"
note = "Stub bodies belong to W5.1 to W5.4."

[[entry]]
id = "arch.6.shell-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-shell exposes ShellApp, the frame context and request, ShellOptions, run and Headless with scripted input"
note = "Stub bodies belong to W0.4. Key events are delivered as EngineKeyEvent after the mapping of arch 10.3."

[[entry]]
id = "arch.3.3.rev-twin-types"
spec = "arch 3.3"
tier = "P4"
status = "implemented"
summary = "Revision stamps are defined in cuboid-image and cuboid-voxel separately, because both crates sit on layer L1 and share only cuboid-num"
note = "Layering workaround. The sketch gives both Image and VoxelWorld a Rev; the clean fix is a single Rev in cuboid-num (W0.3), after which both copies become re-exports."
