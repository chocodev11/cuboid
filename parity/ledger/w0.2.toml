# --- Contract surfaces and decisions --------------------------------------------------------------

[[entry]]
id = "arch.6.image-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-image exposes Image with lazy RGBA8 and alpha statistics, StoredPixels, RgbaBuf, AlphaStats, decode_file, encode_png and signature"
note = "Stub bodies belong to W1.2 and fail with ImageError::Unimplemented or log an error, because panics are denied in the crate. Rev is defined here and re-exported by cuboid-model."

[[entry]]
id = "arch.6.voxel-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-voxel exposes VoxelWorld, ChunkSlot, Chunk, Palette, VoxelSnap, the writers, VoxelFace, Dir, mesh_chunk, expand_face and dda"
note = "Stub bodies belong to W1.3 and W1.4 and log an error. VoxelSnap, from_snapshot and snapshot are additions to the sketch for the apply path of arch 9.1."

[[entry]]
id = "arch.6.model-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-model exposes the document aggregate, ObjList, the object records, UvRect, Selection, the guards, snapshots, the apply and capture functions and the invariant checker"
note = "Stub bodies belong to W1.5 and W1.6. Additions to the sketch: Mesh.tint, DocSnapshot as an alias of Document, Retained as an opaque handle, ListSnap::fresh, MeshMut and BlueprintMut, bake_restricted_rotation, UserMessage and RenderRequest."

[[entry]]
id = "arch.6.actions-surface"
spec = "arch 6"
tier = "P4"
status = "implemented"
summary = "cuboid-actions exposes EngineKey, chords, binding strings, the dispatcher, the held map, ActionId and the menu definition types"
note = "Stub bodies belong to W1.9. ActionId has 234 variants from menus 2, 3 and 5; the ACTIONS and MENUS tables are empty."

[[entry]]
