# Parity ledger of W1.6, apply and capture (snapshot capture by category, the single apply path for
# open, merge, restore and paste, the record normal form and the reference twin). Format:
# parity/README.md.
#
# Acceptance: native 6.2-6.3 rules as tests, and the restore and paste fast paths equal the
# record-shape reference twin (proptest, 10^4 cases). The twin covers restore and paste; open and
# merge share the section rules and are covered by the rule tests below.
#
# Integration note (open): ApplyMode::Open resets the scene itself (native 6.1: properties, model
# box, lists, textures, voxels, display, selection, highlight, overrides and retention), so a
# section the file lacks falls back to the new-document state. The view properties and the
# blueprint are not on the list of 6.1: a file without vp or bp leaves them (native 4.1), and gu
# and gl never come from a file. The caller resets what lives outside the document and sets mp.sp
# afterwards.
#
# Integration note (voxel records): a loader with records that are out of slot or scan order, or
# that repeat a cell, hands the records in file order as LoadedDoc::voxel_replay; apply replays them
# through the full writer. Canonical records and undo snapshots use the VoxelSnap fast path.

wp = "W1.6"

