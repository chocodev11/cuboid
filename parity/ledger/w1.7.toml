# Parity ledger of W1.7, the `.cubik` container and payload codec, the mapping to the model with
# its retention, and legacy `.cub` (crate cuboid-fmt-cubik). Format: parity/README.md.
#
# Acceptance: native 10.1 tests; payload identity on generated documents; semantic round trip with
# the listed normalisations; distinct container errors; a 150 MB payload opens within budget.
#
# Tests without a module path are integration tests of the crate (`tests/*.rs`). Tests marked
# oracle O1 read the private samples named by CUBOID_PARITY_REFS and are `#[ignore]`d: they do not
# run in CI, so an entry that rests on them alone is `implemented` and says so.
#
# Semantic round trip (native 10.2): the save without retention equals the original payload except
# for the normalisations that the test lists in `tests/common/mod.rs::normalised`: a null `fp`
# becomes "", chunk records without voxels are not written again, camera rotations are compared as
# rotations (the Euler copy is recomputed), and `vp.gu`, `vp.gl` are written with their defaults.
# The sample payloads need none of the others; generated documents are in the form Cubik writes.

wp = "W1.7"

