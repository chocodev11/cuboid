[[entry]]
id = "native.9.6.model-box-of-an-import"
spec = "native 9.6"
tier = "P4"
status = "todo"
summary = "The modelBox of a .cub file is set on the live model box and not recorded in the model properties"
note = "Native 9.5 sets the live box only; the gap is a missing LoadedDoc field (cuboid-model). Until then the import stores the box in g.mb and a later .cubik save writes it, which Cubik reads the same. The colour of an element without color also loads as opaque black through the apply path instead of saving as c = 0, and the apply step clamps and re-folds UV corners that native 9.5 keeps unclamped until the save (an apply path without the record normal form is needed)."
