    "cuboid-fmt-cubik::network_device_and_special_paths_are_refused_in_both_slash_forms",
    "cuboid-fmt-cubik::only_regular_files_below_the_cap_are_read",
    "cuboid-fmt-cubik::a_refused_texture_is_a_notice_and_the_import_goes_on",
    "cuboid-fmt-cubik::a_key_or_an_id_that_is_a_rooted_path_is_not_joined_to_the_folder",
]
note = "The refusal of a non-regular file (a pipe, a device node) rests on the metadata check and is not exercised by a test: no portable test can create one. A .cub opened from a network share cannot load the textures next to it, and a folder named like a Windows device (aux, nul, com1) is refused on every platform."

