# --- Performance (architecture 18) ---------------------------------------------------------------------

[[entry]]
id = "arch.18.open-150-mb"
spec = "arch 18"
tier = "P4"
status = "implemented"
summary = "A 150 MB payload (R = 128, 4.1 million voxels) is inflated, decoded and mapped to the model sections, and applied, in well under 2 s; saving it unchanged copies the retained spans, saving it from scratch encodes in parallel"
tests = ["cuboid-fmt-cubik::a_150_mb_payload_opens_and_saves_within_the_budget"]
note = "Ignored in CI (run with --release --include-ignored --nocapture). Measured on 16 threads: encode 0.10 s, compress 0.31 s, inflate 0.25 s, decode and map 0.03 s, apply 0.005 s, unchanged save 0.02 s, full re-encode 0.13-0.25 s; one thread: decode and map 0.09 s."

