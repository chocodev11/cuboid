note = "The damage tests change a few bytes of one valid file; they prove that the readers return, not that the allocation stays small. The record counts (native.8.1.record-count-budget), the .cub limits (native.9.5.cub-limits) and the texture files of a .cub (native.9.5.texture-file-safety) have their own entries. Peak memory is not measured by a test (the workspace forbids unsafe code, so no counting allocator): an out-of-tree probe with a counting allocator measured 103 MB of peak for a 497 KB archive of 10 million sub-meshes (refused) and 392 MB for a 436 KB archive of 10 million vertices (within the limit of the mesh data items). The fuzz targets fuzz/fuzz_targets/cubik.rs and cub.rs type-check; no coverage-guided run was done here (no nightly toolchain), so the 1 h clean run of native 10.4 is still open, and the corpus should be seeded with the floods of the entries above."

[[entry]]
id = "native.8.1.record-count-budget"
spec = "native 8.1"
tier = "P4"
status = "tested"
summary = "Elements, meshes and sub-meshes of the whole payload share one budget (max_objects), as do the texture records (max_textures) and the items of the mesh data arrays (max_mesh_items); the count is checked before an item is stored, so a small archive that declares millions of them fails with a limit error"
tests = [
    "cuboid-fmt-cubik::sub_meshes_are_counted_over_all_meshes",
    "cuboid-fmt-cubik::elements_meshes_and_sub_meshes_share_one_budget",
    "cuboid-fmt-cubik::textures_are_counted_in_the_file",
    "cuboid-fmt-cubik::the_mesh_data_arrays_are_counted_over_the_file",
    "cuboid-fmt-cubik::tests::codec::limits_are_checked_before_allocating",
]
note = "The container reservation follows the archive length, not the compressed size of the header. The default max_objects is 262 144, sized against the memory of a loaded element (about 1.6 KB); the vertex arrays still cost about 40 bytes of memory per 8 bytes of payload, up to max_mesh_items (16.7 million)."

[[entry]]
id = "native.9.5.cub-limits"
spec = "native 9.5"
tier = "P4"
status = "tested"
summary = "The .cub importer refuses a file above max_text before decoding it, more elements than max_objects, more texture entries (declared or named by a face) than max_textures, more voxel cells than max_array and a voxel grid above the memory budget, and looks the face labels up in a hash set, so the import time is linear in the number of textures"
tests = [
    "cuboid-fmt-cubik::a_cub_with_a_million_elements_is_refused_before_they_are_built",
    "cuboid-fmt-cubik::a_cub_over_the_text_limit_is_refused_before_it_is_decoded",
    "cuboid-fmt-cubik::texture_entries_are_counted_before_any_file_is_looked_for",
    "cuboid-fmt-cubik::voxel_cells_and_the_grid_are_limited",
    "cuboid-fmt-cubik::many_new_face_textures_import_in_linear_time",
    "cuboid-fmt-cubik::many_declared_textures_import_in_linear_time",
]
note = "The speed tests bound the time at 8 s for 65 000 textures (a quadratic lookup took 23 s for 80 000 in release). The text becomes a tree of the cuboid-io parser first, about 40 times the file size for a flood of empty objects, which max_text (16 MiB) bounds; the parser itself belongs to W1.8."

