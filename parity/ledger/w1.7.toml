tier = "P4"
status = "tested"
summary = "The texture search reads only regular local files up to 64 MiB: network paths (UNC and double slash), device and verbatim namespaces, reserved device names, stream names and drive-relative paths are refused by their text before the file system is asked, keys and ids that are rooted paths are not joined to the folder, and a refused texture is a notice while the import goes on"
