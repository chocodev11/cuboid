[package]
name = "cuboid-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Not a member of the main workspace and never shipped (architecture 3.1, 5). It needs a nightly
# toolchain: `cargo +nightly fuzz run <target>`. Generated libFuzzer entry points are the only
# code in the repository that is exempt from `forbid(unsafe_code)`.
[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
libfuzzer-sys = "0.4.13"
cuboid-bson = { path = "../crates/cuboid-bson" }
cuboid-fmt-bbmodel = { path = "../crates/cuboid-fmt-bbmodel" }
cuboid-fmt-cubik = { path = "../crates/cuboid-fmt-cubik" }
cuboid-fmt-minecraft = { path = "../crates/cuboid-fmt-minecraft" }
cuboid-fmt-voxel = { path = "../crates/cuboid-fmt-voxel" }
cuboid-image = { path = "../crates/cuboid-image" }
cuboid-io = { path = "../crates/cuboid-io" }
cuboid-library = { path = "../crates/cuboid-library" }
cuboid-mcp = { path = "../crates/cuboid-mcp" }
cuboid-model = { path = "../crates/cuboid-model" }
cuboid-settings = { path = "../crates/cuboid-settings" }
cuboid-ui = { path = "../crates/cuboid-ui" }

[[bin]]
name = "bson"
path = "fuzz_targets/bson.rs"
test = false
doc = false
bench = false

